     chrome --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=2500,1686 --screenshot=rich-menu.png rich-menu.html
     ตำแหน่งช่องต้องตรงกับ COLUMNS / ROWS ใน rich-menu.ts แล้วเปลี่ยน RICH_MENU_VERSION ด้วย -->
<html lang="th">

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: "Leelawadee UI", "Leelawadee", Tahoma, sans-serif; background: #123D30; position: relative; }
  .tile { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .job { color: #fff; border-right: 3px solid rgba(217, 192, 138, .45); border-bottom: 3px solid rgba(217, 192, 138, .45); }
  .job svg { width: 210px; height: 210px; stroke: #D9C08A; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .job b { font-size: 104px; font-weight: 700; margin-top: 34px; line-height: 1.15; }
  .job span { font-size: 54px; color: #D9C08A; margin-top: 12px; }
  .tool { background: #F4EDDC; color: #123D30; flex-direction: row; gap: 40px; border-right: 3px solid rgba(18, 61, 48, .25); }
  .tool svg { width: 150px; height: 150px; stroke: #123D30; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tool b { font-size: 84px; font-weight: 700; line-height: 1.15; text-align: left; }
  .last { border-right: 0; }
</style>
</head>
