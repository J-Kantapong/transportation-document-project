# เลขาส่วนตัว: ส่งสรุปเช้า 09:00 / สรุปเย็น 16:00 (เวลาไทย) เข้าไลน์ (ผู้ใช้ 2026-10-07)
# GitHub ตั้งเวลาทำงานเฉพาะไฟล์ที่อยู่บน default branch (master) เท่านั้น - บน dev จะไม่รันเอง
# ค่าที่ต้องตั้งที่ GitHub: Settings > Secrets and variables > Actions > New repository secret
#   SECRETARY_BACKEND_URL = ที่อยู่ backend ไม่มี / ท้าย เช่น https://xxxx.onrender.com
#   SECRETARY_RUN_KEY     = กุญแจเดียวกับ SECRETARY_RUN_KEY ที่ตั้งบน Render (อย่างน้อย 16 ตัวอักษร สุ่มยาวๆ)
# GitHub อาจเลื่อนเวลาได้หลายนาทีตอนคิวแน่น - เซิร์ฟเวอร์ Render แผนฟรีที่หลับอยู่ต้องรอปลุกประมาณ 1 นาที จึง retry ไว้
name: secretary

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 09:00 เวลาไทย
    - cron: '0 9 * * *' # 09:00 UTC = 16:00 เวลาไทย
  workflow_dispatch:
    inputs:
      slot:
        description: ส่งรอบไหนเดี๋ยวนี้ (ทดสอบ)
        type: choice
        options: [morning, evening]
        default: morning

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send summary
        env:
          BACKEND_URL: ${{ secrets.SECRETARY_BACKEND_URL }}
          RUN_KEY: ${{ secrets.SECRETARY_RUN_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$RUN_KEY" ]; then
            echo "ยังไม่ได้ตั้ง secret SECRETARY_BACKEND_URL / SECRETARY_RUN_KEY" >&2
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SLOT="$INPUT_SLOT"
          elif [ "$CRON" = "0 2 * * *" ]; then
            SLOT=morning
          else
            SLOT=evening
          fi
          echo "slot=$SLOT"
          curl --silent --show-error --fail-with-body \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "x-secretary-key: $RUN_KEY" \
            "${BACKEND_URL%/}/api/secretary/run?slot=$SLOT"
